<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:site_name" content="CRaC">
<meta property="og:title" content="{{ if .IsHome }}CRaC — Coordinated Restore at Checkpoint{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="{{ if eq .Kind "page" }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
{{- with partial "social-image.html" . }}
<meta property="og:image" content="{{ .Permalink }}">
<meta property="og:image:width" content="{{ .Width }}">
<meta property="og:image:height" content="{{ .Height }}">
<meta property="og:image:alt" content="{{ if $.IsHome }}CRaC — Coordinated Restore at Checkpoint{{ else }}{{ $.Title }}{{ end }}">
{{- end }}

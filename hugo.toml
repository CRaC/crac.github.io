# crac.org — the CRaC project site.
#
# Overridden by the GitHub Pages workflow so a project-site preview builds
# under its own URL.
baseURL = "https://crac.org/"
locale = "en-GB"
defaultContentLanguage = "en"
title = "CRaC"
enableRobotsTXT = true
timeZone = "Europe/Brussels"
summaryLength = 30
# No taxonomies on this site; without this Hugo renders empty /categories/ and
# /tags/ list pages that the link check and the sitemap then have to explain.
disableKinds = ["taxonomy", "term"]

# No theme. This was hugo-theme-relearn; the layouts are now the site's own, so
# themes/hugo-theme-relearn-7.3.2/ is dead weight and can be deleted.

[markup.goldmark.renderer]
  unsafe = true            # a few pages carry inline HTML and <details>
[markup.highlight]
  noClasses = false
  style = "nord"
  tabWidth = 2
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[pagination]
  pagerSize = 20

[minify]
  minifyOutput = true

# /llms.txt — the llmstxt.org convention: one plain-text index of the site for
# a model that has been pointed at it, generated from the content.
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "rss", "llms"]

[params]
  description = "Coordinated Restore at Checkpoint (CRaC) is an OpenJDK project for starting Java applications from a checkpoint image, cutting time to first transaction from seconds to milliseconds."
  # Fallback image for a shared link. CRaC has no artwork, so this is generated
  # rather than a file — see layouts/_partials/social-image.html.
  socialImage = ""
  # Where "Edit it on GitHub" points. The branch is the one Pages deploys from,
  # so an edit made through that link is an edit to what the site serves.
  repo = "https://github.com/CRaC/crac.github.io"
  repoBranch = "main"

[menus]
  # Top-level items carry an `identifier`; children point at it with `parent`,
  # which is what gives the header its drop-downs. Give every entry an
  # identifier when its name is not unique: Hugo derives one from the name, so
  # two children called "Overview" silently become one entry.
  # Weight 0 reads as unset and sorts last, so the first child needs weight 1.
  [[menus.main]]
    identifier = "use"
    name = "Using CRaC"
    pageRef = "/use"
    weight = 10
    [[menus.main]]
      identifier = "use-overview"
      name = "Overview"
      pageRef = "/use"
      parent = "use"
      weight = 1
    [[menus.main]]
      name = "Runtimes with CRaC"
      pageRef = "/use/crac-runtime"
      parent = "use"
      weight = 2
    [[menus.main]]
      name = "Checkpoint and restore"
      pageRef = "/use/checkpoint-and-restore"
      parent = "use"
      weight = 3
    [[menus.main]]
      name = "Implementing the API"
      pageRef = "/use/implement-crac"
      parent = "use"
      weight = 4


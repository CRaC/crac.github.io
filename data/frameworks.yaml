# Frameworks that ship CRaC support, with the mark each project uses for
# itself. Every version and capability here is taken from the framework's own
# page in content/frameworks/ — which is in turn taken from the framework's own
# documentation. Nothing on this list is inferred: a wrong version number here
# would be a wrong version number on the home page.
frameworks:
  - name: "Spring Boot"
    logo: "images/logo/spring.png"
    page: "/frameworks/spring-boot/"
    example: "https://github.com/CRaC/example-spring-boot"
    since: "3.2"
    points:
      - "CRaC support in the framework as of Spring Boot 3.2"
      - "Spring Framework coordinates bean lifecycle around the checkpoint"

  - name: "Quarkus"
    logo: "images/logo/quarkus.svg"
    page: "/frameworks/quarkus/"
    example: "https://github.com/CRaC/example-quarkus"
    since: "2.10.0"
    points:
      - "Basic CRaC support since Quarkus 2.10.0"

  - name: "Micronaut"
    logo: "images/logo/micronaut.webp"
    page: "/frameworks/micronaut/"
    example: "https://github.com/CRaC/example-micronaut"
    points:
      - "A <code>crac</code> feature on micronaut.io/launch"
      - "Hikari DataSource and Redis coordination"
      - "Gradle plugin builds the image in one command"

  - name: "AWS Lambda"
    logo: "images/logo/aws-lambda.webp"
    page: "/frameworks/aws-lambda/"
    example: "https://github.com/crac/example-lambda"
    points:
      - "CRaC-patched aws-lambda-java-libs"
      - "Published under <code>io.github.crac.com.amazonaws</code>"

# Beyond the four above — which have a page here, an example repository and
# measured numbers — these projects ship CRaC support of their own. The link on
# each is the project's OWN documentation of it, never a write-up about it, and
# the list is alphabetical so nothing in it reads as a ranking. A project whose
# support is announced but not documented anywhere a reader can check does not
# go on this list: this site would then be the only source for a claim about
# someone else's software.
more:
  - name: "Atoti Server"
    by: "ActiveViam"
    note: "Checkpoint and restore for the analytics server, documented by ActiveViam."
    url: "https://docs.activeviam.com/engine/java-sdk/6.1/crac/overview"

  - name: "Helidon"
    since: "4.2"
    note: "A CRaC guide for both Helidon SE and Helidon MP."
    url: "https://helidon.io/docs/v4/se/guides/crac"

  - name: "JRuby"
    since: "10"
    note: "Ruby on the JVM — the launcher takes the checkpoint, so Ruby start-up goes with it."
    url: "https://blog.headius.com/2024/09/jruby-on-crac-part-1-lets-get-cracking.html"

  - name: "Open Liberty"
    since: "crac-1.4"
    note: "A feature that implements the org.crac API over Liberty InstantOn."
    url: "https://openliberty.io/docs/latest/reference/feature/crac-1.4.html"

  - name: "Payara"
    note: "A technical preview in Payara Micro and Payara Server, from the December 2025 release."
    url: "https://docs.payara.fish/"

  - name: "Piranha"
    since: "23.1.0"
    note: "A --enable-crac switch on the Servlet and Core Profile distributions."
    url: "https://piranha.cloud/release/dist/servlet/run_a_web_application_on_crac.html"
